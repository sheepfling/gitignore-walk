name: CI
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            checks: test
          - os: ubuntu-latest
            python: '3.12'
            checks: all
          - os: ubuntu-latest
            python: '3.15'
            checks: test
          - os: windows-latest
            python: '3.12'
            checks: test
          - os: macos-latest
            python: '3.12'
            checks: test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m scripts.ci ${{ matrix.checks }}

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            checks: test
          - os: ubuntu-latest
            python: '3.12'
            checks: all
          - os: ubuntu-latest
            python: '3.15'
            checks: test
          - os: windows-latest
            python: '3.12'
            checks: test
          - os: macos-latest
            python: '3.12'
            checks: test
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: matrix.checks == 'all'
        run: python -m pip install -e '.[dev]'
      - if: matrix.checks == 'test'
        run: python -m pip install 'pytest>=8.3'
      - run: python -m scripts.ci ${{ matrix.checks }}
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mercurial subversion fossil libatomic1
      - name: Download pinned Perforce 2026.1 Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://ftp.perforce.com/perforce/r26.1/bin.linux26x86_64/p4 \
            --output "$RUNNER_TEMP/p4"
          curl --fail --location --silent --show-error \
            https://ftp.perforce.com/perforce/r26.1/bin.linux26x86_64/p4d \
            --output "$RUNNER_TEMP/p4d"
          echo 'bfbb838cc5794a6a678df65e52841004ca7e192119a1c108adac3d47f6ccb4fc  '"$RUNNER_TEMP/p4" | sha256sum --check
          echo 'e2c1e11865774782eb37483c0a6f6ebdfc09d9dca6f44880ae59059cdf7b1847  '"$RUNNER_TEMP/p4d" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/p4" "$RUNNER_TEMP/p4d"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install package and test tools
        id: setup
        run: python -m pip install -e . 'pytest>=8.3' breezy==3.3.24
      - name: Run native-backed policy tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -m scripts.ci test
      - name: Capture isolated Subversion config precedence in Debian
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          python -m scripts.ci oracle-svn-config --output "$RUNNER_TEMP/native/svn-config-precedence.json"
      - name: Capture Darcs oracle in Debian 13
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq darcs python3 && python3 tests/oracles/darcs/run.py --output /output/darcs-oracle.json'
          python -c "from pathlib import Path; from scripts.ci_native import inspect_capture; path = Path(r'$RUNNER_TEMP/native/darcs-oracle.json'); result = inspect_capture(path); print(result); raise SystemExit(not result['passed'])"
      - name: Enable ARM64 emulation for native oracles
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Recapture Mercurial 7.0.1 on Debian 13
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mercurial python3 util-linux && su -s /bin/sh nobody -c "python3 tests/oracles/hg/run.py --output /tmp/hg-7.0.1-linux-x86_64.json" && cp /tmp/hg-7.0.1-linux-x86_64.json /output/hg-7.0.1-linux-x86_64.json'
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mercurial python3 util-linux && su -s /bin/sh nobody -c "python3 tests/oracles/hg/run.py --output /tmp/hg-7.0.1-linux-aarch64.json" && cp /tmp/hg-7.0.1-linux-aarch64.json /output/hg-7.0.1-linux-aarch64.json'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "native"
          expected_flags = {
              "hg.regex-ascii-inline-flag": False,
              "hg.regex-locale-inline-flag": False,
              "hg.regex-verbose-inline-flag": True,
          }
          for filename, architecture in (
              ("hg-7.0.1-linux-aarch64.json", "aarch64"),
              ("hg-7.0.1-linux-x86_64.json", "x86_64"),
          ):
              capture = json.loads((directory / filename).read_text(encoding="utf-8"))
              assert capture["status"] == "captured"
              assert capture["client"]["version"] == "Mercurial Distributed SCM (version 7.0.1)"
              assert architecture in capture["client"]["platform"]
              assert len(capture["cases"]) == 71
              assert not any(case["candidate_matches"] is False for case in capture["cases"])
              observations = {case["id"]: case for case in capture["cases"]}
              for case_id, expected in expected_flags.items():
                  case = observations[case_id]
                  assert case["native_status"] == "captured"
                  assert case["candidate_matches"] is True
                  assert case["observed_ignored"] is expected
          PY
      - name: Capture Darcs oracle on Debian 13 ARM64
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq darcs python3 && python3 tests/oracles/darcs/run.py --output /output/darcs-debian13-arm64.json'
          python -c "from pathlib import Path; from scripts.ci_native import inspect_capture; path = Path(r'$RUNNER_TEMP/native/darcs-debian13-arm64.json'); result = inspect_capture(path); print(result); raise SystemExit(not result['passed'])"
      - name: Download pinned Sapling and Jujutsu ARM64 releases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compat-clients"
          curl --fail --location --silent --show-error \
            'https://github.com/meta/sapling/releases/download/0.2.20261103-145137%2B6282ac56/sapling-0.2.20261103-145137+6282ac56-linux-arm64.tar.xz' \
            --output "$RUNNER_TEMP/compat-clients/sapling-linux-arm64.tar.xz"
          curl --fail --location --silent --show-error \
            'https://github.com/meta/sapling/releases/download/0.2.20261028-123539%2B7415fb2f/sapling-0.2.20261028-123539+7415fb2f-linux-arm64.tar.xz' \
            --output "$RUNNER_TEMP/compat-clients/sapling-0.2.20261028-linux-arm64.tar.xz"
          curl --fail --location --silent --show-error \
            'https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-aarch64-unknown-linux-musl.tar.gz' \
            --output "$RUNNER_TEMP/compat-clients/jj-linux-arm64.tar.gz"
          echo 'a8bb6388703c30630219933e482955faa33744cfb06bcd201910785cbe3c5749  '"$RUNNER_TEMP/compat-clients/sapling-linux-arm64.tar.xz" | sha256sum --check
          echo '6257b24ca41a3b430f46bdcedecd42d3f2e6f2e1807645f9b2b5a0c204e03dd5  '"$RUNNER_TEMP/compat-clients/sapling-0.2.20261028-linux-arm64.tar.xz" | sha256sum --check
          echo '0f300e1576de8dabe0a9dedf0b87ae44f8accea5cf54d9a342a51061c1fb1bcd  '"$RUNNER_TEMP/compat-clients/jj-linux-arm64.tar.gz" | sha256sum --check
      - name: Capture Sapling and Jujutsu on Debian 13 ARM64
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker run --rm --platform linux/arm64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/compat-clients:/clients:ro" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 xz-utils && mkdir -p /tmp/sapling /tmp/sapling-old /tmp/jj && tar -xJf /clients/sapling-linux-arm64.tar.xz -C /tmp/sapling && tar -xJf /clients/sapling-0.2.20261028-linux-arm64.tar.xz -C /tmp/sapling-old && tar -xzf /clients/jj-linux-arm64.tar.gz -C /tmp/jj && python3 tests/oracles/compat/run.py --sl /tmp/sapling/sl --jj /tmp/jj/jj --output /output/sapling-0.2.20261103-jj-0.47.1-debian13-arm64.json && python3 tests/oracles/compat/run.py --workspace-boundary-only --sl /tmp/sapling/sl --jj /tmp/jj/jj --output /output/workspace-boundaries-sapling-0.2.20261103-jj-0.47.1-debian13-arm64.json && python3 tests/oracles/compat/run.py --linked-worktree-only --sl /tmp/sapling/sl --jj /tmp/jj/jj --output /output/linked-worktree-sapling-0.2.20261103-jj-0.47.1-debian13-arm64.json && python3 tests/oracles/compat/sapling_release_profiles.py --sl /tmp/sapling-old/sl --profile-version 0.2.20261028 --output /output/sapling-0.2.20261028-behavior-debian13-arm64.json && python3 tests/oracles/compat/sapling_release_profiles.py --sl /tmp/sapling/sl --profile-version 0.2.20261103 --output /output/sapling-0.2.20261103-behavior-debian13-arm64.json'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.ci_native import inspect_capture

          path = Path(os.environ["RUNNER_TEMP"]) / "native/sapling-0.2.20261103-jj-0.47.1-debian13-arm64.json"
          result = inspect_capture(path)
          capture = json.loads(path.read_text(encoding="utf-8"))
          boundary_path = Path(os.environ["RUNNER_TEMP"]) / "native/workspace-boundaries-sapling-0.2.20261103-jj-0.47.1-debian13-arm64.json"
          boundary = json.loads(boundary_path.read_text(encoding="utf-8"))
          linked_path = Path(os.environ["RUNNER_TEMP"]) / "native/linked-worktree-sapling-0.2.20261103-jj-0.47.1-debian13-arm64.json"
          linked = json.loads(linked_path.read_text(encoding="utf-8"))
          release_profiles = {
              "0.2.20261028": {"sl": set(), "git": {
                  "empty/target/under-empty-ignore.tmp",
                  "missing/target/under-missing-ignore.tmp",
                  "nested/target/under-nested-ignore.tmp",
                  "nested/child/local.childignore",
              }},
              "0.2.20261103": {"sl": {
                  "empty/target/under-empty-ignore.tmp",
                  "missing/target/under-missing-ignore.tmp",
                  "nested/target/under-nested-ignore.tmp",
                  "nested/child/local.childignore",
              }, "git": {
                  "empty/target/under-empty-ignore.tmp",
                  "missing/target/under-missing-ignore.tmp",
                  "nested/target/under-nested-ignore.tmp",
                  "nested/child/local.childignore",
              }},
          }
          for version, expected_by_mode in release_profiles.items():
              path = Path(os.environ["RUNNER_TEMP"]) / f"native/sapling-{version}-behavior-debian13-arm64.json"
              profile = json.loads(path.read_text(encoding="utf-8"))
              assert profile["client"].startswith(f"Sapling {version}")
              assert {case["mode"] for case in profile["cases"]} == set(expected_by_mode)
              for case in profile["cases"]:
                  assert case["candidate_matches"]
                  assert set(case["ignored"]) == expected_by_mode[case["mode"]]
          assert result["passed"], result
          assert len(capture["cases"]) == 4
          assert "Sapling 0.2.20261103" in capture["clients"]["sapling"]
          assert capture["clients"]["jujutsu"].startswith("jj 0.47.1")
          assert all(case["configured_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["configured_system"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_onbranch"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_remote_url"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["git_config_matches"] for case in capture["cases"])
          assert all(not case["conditional_gitdir_override"]["native_matches_git_config"] for case in capture["cases"])
          assert all(case["configured_repository"]["candidate_matches"] for case in capture["cases"])
          assert all(case["environment_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["symlinked_gitignore"]["candidate_matches"] for case in capture["cases"])
          assert [case["ignored"] for case in linked["cases"]] == [
              ["probe.commonignore"],
              ["probe.commonignore"],
              ["probe.worktreeignore"],
          ]
          assert all(case["candidate_matches"] for case in linked["cases"])
          assert "Sapling 0.2.20261103" in boundary["clients"]["sapling"]
          assert boundary["clients"]["jujutsu"].startswith("jj 0.47.1")
          assert {case["id"] for case in boundary["cases"]} == {
              "sapling.sl-parent-sl-child", "sapling.sl-parent-git-child",
              "sapling.git-parent-git-child", "sapling.git-parent-sl-child",
              "jj.colocated-parent-colocated-child", "jj.colocated-parent-noncolocated-child",
              "jj.noncolocated-parent-colocated-child", "jj.noncolocated-parent-noncolocated-child",
          }
          assert all(case["candidate_matches"] for case in boundary["cases"])
          print(result)
          PY
      - name: Download pinned Sapling and Jujutsu x86_64 releases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://github.com/meta/sapling/releases/download/0.2.20261103-145137%2B6282ac56/sapling-0.2.20261103-145137+6282ac56-linux-x64.tar.xz' \
            --output "$RUNNER_TEMP/compat-clients/sapling-linux-x64.tar.xz"
          curl --fail --location --silent --show-error \
            'https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz' \
            --output "$RUNNER_TEMP/compat-clients/jj-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/jj-vcs/jj/releases/download/v0.45.1/jj-v0.45.1-x86_64-unknown-linux-musl.tar.gz' \
            --output "$RUNNER_TEMP/compat-clients/jj-0.45.1-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            'https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz' \
            --output "$RUNNER_TEMP/compat-clients/jj-0.46.0-linux-x64.tar.gz"
          echo '682f965b3abeae0a5ca0e1d64f35558679bad2fc79d5f6df34c7e82a52f9788c  '"$RUNNER_TEMP/compat-clients/sapling-linux-x64.tar.xz" | sha256sum --check
          echo 'd4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7  '"$RUNNER_TEMP/compat-clients/jj-linux-x64.tar.gz" | sha256sum --check
          echo 'f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72  '"$RUNNER_TEMP/compat-clients/jj-0.45.1-linux-x64.tar.gz" | sha256sum --check
          echo 'fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08  '"$RUNNER_TEMP/compat-clients/jj-0.46.0-linux-x64.tar.gz" | sha256sum --check
      - name: Capture Sapling and Jujutsu on Debian 13 x86_64
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/compat-clients:/clients:ro" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 xz-utils && mkdir -p /tmp/sapling /tmp/jj /tmp/jj046 && tar -xJf /clients/sapling-linux-x64.tar.xz -C /tmp/sapling && tar -xzf /clients/jj-linux-x64.tar.gz -C /tmp/jj && tar -xzf /clients/jj-0.46.0-linux-x64.tar.gz -C /tmp/jj046 && python3 tests/oracles/compat/run.py --sl /tmp/sapling/sl --jj /tmp/jj/jj --output /output/sapling-0.2.20261103-jj-0.47.1-debian13-x86_64.json && python3 tests/oracles/compat/run.py --workspace-boundary-only --sl /tmp/sapling/sl --jj /tmp/jj/jj --output /output/workspace-boundaries-sapling-0.2.20261103-jj-0.47.1-debian13-x86_64.json && python3 tests/oracles/compat/run.py --jj /tmp/jj046/jj --jj-only --workspace-boundary-only --output /output/workspace-boundaries-jj-0.46.0-debian13-x86_64.json && python3 tests/oracles/compat/run.py --jj /tmp/jj046/jj --jj-only --output /output/jj-0.46.0-debian13-x86_64.json && python3 tests/oracles/compat/run.py --linked-worktree-only --sl /tmp/sapling/sl --jj /tmp/jj/jj --output /output/linked-worktree-sapling-0.2.20261103-jj-0.47.1-debian13-x86_64.json'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.ci_native import inspect_capture

          path = Path(os.environ["RUNNER_TEMP"]) / "native/sapling-0.2.20261103-jj-0.47.1-debian13-x86_64.json"
          result = inspect_capture(path)
          capture = json.loads(path.read_text(encoding="utf-8"))
          boundary_path = Path(os.environ["RUNNER_TEMP"]) / "native/workspace-boundaries-sapling-0.2.20261103-jj-0.47.1-debian13-x86_64.json"
          boundary = json.loads(boundary_path.read_text(encoding="utf-8"))
          linked_path = Path(os.environ["RUNNER_TEMP"]) / "native/linked-worktree-sapling-0.2.20261103-jj-0.47.1-debian13-x86_64.json"
          linked = json.loads(linked_path.read_text(encoding="utf-8"))
          jj046_path = Path(os.environ["RUNNER_TEMP"]) / "native/jj-0.46.0-debian13-x86_64.json"
          jj046_result = inspect_capture(jj046_path)
          jj046 = json.loads(jj046_path.read_text(encoding="utf-8"))
          jj046_boundary_path = Path(os.environ["RUNNER_TEMP"]) / "native/workspace-boundaries-jj-0.46.0-debian13-x86_64.json"
          jj046_boundary = json.loads(jj046_boundary_path.read_text(encoding="utf-8"))
          assert result["passed"], result
          assert len(capture["cases"]) == 4
          assert "x86_64" in capture["platform"]
          assert "Sapling 0.2.20261103" in capture["clients"]["sapling"]
          assert capture["clients"]["jujutsu"].startswith("jj 0.47.1")
          assert all(case["configured_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["configured_system"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_onbranch"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_remote_url"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["git_config_matches"] for case in capture["cases"])
          assert all(not case["conditional_gitdir_override"]["native_matches_git_config"] for case in capture["cases"])
          assert all(case["configured_repository"]["candidate_matches"] for case in capture["cases"])
          assert all(case["environment_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["symlinked_gitignore"]["candidate_matches"] for case in capture["cases"])
          assert jj046_result["passed"], jj046_result
          assert "x86_64" in jj046["platform"]
          assert jj046["clients"]["jujutsu"].startswith("jj 0.46.0-")
          assert {case["id"] for case in jj046["cases"]} == {"jj.colocated", "jj.noncolocated"}
          assert all(case["candidate_matches"] for case in jj046["cases"])
          assert jj046_boundary["clients"]["jujutsu"].startswith("jj 0.46.0-")
          assert len(jj046_boundary["cases"]) == 4
          assert all(case["candidate_matches"] for case in jj046_boundary["cases"])
          for case in jj046["cases"]:
              assert case["source_discovery"]["candidate_matches"]
              assert case["pattern_discovery"]["candidate_matches"]
              assert case["symlinked_gitignore"]["candidate_matches"]
              assert all(case[key]["candidate_matches"] for key in (
                  "configured_global", "configured_system", "conditional_global",
                  "conditional_gitdir_i", "conditional_worktree", "conditional_worktree_i",
                  "conditional_onbranch", "conditional_remote_url", "conditional_gitdir_override",
                  "environment_global", "configured_repository",
              ))
          assert "x86_64" in linked["platform"]
          assert [case["ignored"] for case in linked["cases"]] == [
              ["probe.commonignore"],
              ["probe.commonignore"],
              ["probe.worktreeignore"],
          ]
          assert all(case["candidate_matches"] for case in linked["cases"])
          assert "Sapling 0.2.20261103" in boundary["clients"]["sapling"]
          assert boundary["clients"]["jujutsu"].startswith("jj 0.47.1")
          assert len(boundary["cases"]) == 8
          assert all(case["candidate_matches"] for case in boundary["cases"])
          print(result)
          PY
      - name: Verify Jujutsu symlink behavior change across releases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/compat-clients:/clients:ro" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian:13-slim \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 >/dev/null && mkdir -p /tmp/jj-0.45.1 /tmp/jj-0.46.0 && tar -xzf /clients/jj-0.45.1-linux-x64.tar.gz -C /tmp/jj-0.45.1 && tar -xzf /clients/jj-0.46.0-linux-x64.tar.gz -C /tmp/jj-0.46.0 && python3 tests/oracles/compat/run.py --jj /tmp/jj-0.45.1/jj --symlink-only --expect-jj-follows-symlink --output /output/jj-0.45.1-debian13-x86_64-symlink.json && python3 tests/oracles/compat/run.py --jj /tmp/jj-0.46.0/jj --symlink-only --output /output/jj-0.46.0-debian13-x86_64-symlink.json'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.ci_native import inspect_capture

          directory = Path(os.environ["RUNNER_TEMP"]) / "native"
          for filename, version, follows in (
              ("jj-0.45.1-debian13-x86_64-symlink.json", "0.45.1", True),
              ("jj-0.46.0-debian13-x86_64-symlink.json", "0.46.0", False),
          ):
              path = directory / filename
              result = inspect_capture(path)
              capture = json.loads(path.read_text(encoding="utf-8"))
              assert result["passed"], result
              assert capture["clients"]["jujutsu"].startswith(f"jj {version}")
              assert capture["expected_follow_symlink"] is follows
              expected_ignored = ["nested/probe.symlink"] if follows else []
              assert all(case["ignored"] == expected_ignored for case in capture["cases"])
          PY
      - name: Capture worktree conditional behavior with Git 2.56
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/git-2.56-source"
          client_dir="$RUNNER_TEMP/compat-clients"
          mkdir -p "$client_dir/sapling" "$client_dir/jj"
          git clone --depth 1 --branch v2.56.0 https://github.com/git/git.git "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = a018953688f1b10bddf91bff8747068f5f4746a4
          make -C "$source_dir" -j2 NO_RUST=YesPlease NO_OPENSSL=YesPlease \
            NO_CURL=YesPlease NO_EXPAT=YesPlease NO_GETTEXT=YesPlease NO_TCLTK=YesPlease git
          tar -xJf "$client_dir/sapling-linux-x64.tar.xz" -C "$client_dir/sapling"
          tar -xzf "$client_dir/jj-linux-x64.tar.gz" -C "$client_dir/jj"
          PATH="$source_dir:$PATH" python3 tests/oracles/compat/run.py \
            --sl "$client_dir/sapling/sl" --jj "$client_dir/jj/jj" \
            --output "$RUNNER_TEMP/native/sapling-0.2.20261103-jj-0.47.1-git-2.56.0-debian13-x86_64.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "native/sapling-0.2.20261103-jj-0.47.1-git-2.56.0-debian13-x86_64.json"
          capture = json.loads(path.read_text(encoding="utf-8"))
          assert capture["clients"]["git"].startswith("git version 2.56.0")
          assert all(case["conditional_worktree"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["git_config_matches"] for case in capture["cases"])
          assert all(not case["conditional_gitdir_override"]["native_matches_git_config"] for case in capture["cases"])
          assert all(case["environment_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["symlinked_gitignore"]["candidate_matches"] for case in capture["cases"])
          observations = {case["id"]: case for case in capture["cases"]}
          for key, expected in (("conditional_worktree", "conditional.worktree"), ("conditional_worktree_i", "conditional.worktreei")):
            assert observations["sapling.git-mode"][key]["ignored"] == [expected]
            assert observations["jj.colocated"][key]["ignored"] == []
            assert observations["jj.colocated"][key]["native_matches_git_config"] is False
          PY
          PATH="$source_dir:$PATH" python3 -m pytest tests/test_git_compatible_schemes.py -q
      - name: Check selected Linux native captures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m scripts.ci native --include-trust
          --backends hg svn fossil brz p4
          --output-dir "$RUNNER_TEMP/native"
      - name: Check Breezy 3.3.11 on Debian 13
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/native:/output" \
            --workdir /workspace \
            debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq brz=3.3.11-1 python3 && python3 tests/oracles/breezy/run.py --brz brz --output /output/brz-3.3.11-linux-x86_64-py313.json'
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.ci_native import inspect_capture

          path = Path(os.environ["RUNNER_TEMP"]) / "native/brz-3.3.11-linux-x86_64-py313.json"
          result = inspect_capture(path)
          capture = json.loads(path.read_text(encoding="utf-8"))
          assert result["passed"], result
          assert capture["client"]["brz"]["version"] == "Breezy (brz) 3.3.11"
          assert capture["client"]["runner_python"].startswith("3.13.")
          assert len(capture["cases"]) == 41
          assert len(capture["excluded_cases"]) == 4
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-oracles
          path: ${{ runner.temp }}/native
          if-no-files-found: warn
          retention-days: 7
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Mercurial
        shell: pwsh
        run: |
          winget install --id Mercurial.Mercurial --exact --silent --accept-package-agreements --accept-source-agreements
          $hgPath = (Get-Command hg.exe -ErrorAction SilentlyContinue).Source
          if (-not $hgPath) {
            $candidates = @(
              "$env:ProgramFiles\Mercurial\hg.exe",
              "${env:ProgramFiles(x86)}\Mercurial\hg.exe"
            )
            $hgPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $hgPath) { throw 'Mercurial installed, but hg.exe was not found.' }
          Split-Path $hgPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $hgPath --version
      - name: Install SlikSVN command line tools
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'Slik-Subversion-1.14.5-x64.msi'
          Invoke-WebRequest `
            -Uri 'https://sliksvn.com/pub/Slik-Subversion-1.14.5-x64.msi' `
            -OutFile $installer
          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart') `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "SlikSVN installer failed: $($install.ExitCode)" }
          $svnBin = Join-Path $env:ProgramFiles 'SlikSvn\bin'
          $svnPath = Join-Path $svnBin 'svn.exe'
          if (-not (Test-Path $svnPath)) { throw "SlikSVN installation did not contain $svnPath." }
          if (-not (Test-Path (Join-Path $svnBin 'svnadmin.exe'))) {
            throw 'SlikSVN installation did not contain svnadmin.exe.'
          }
          if (-not (Test-Path (Join-Path $svnBin 'svnserve.exe'))) {
            Write-Host 'svnserve is unavailable; protocol-dependent Subversion cases will be explicitly skipped.'
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $svnPath --version --quiet
      - name: Install package and test tools
        id: setup
        run: python -m pip install -e . 'pytest>=8.3' breezy==3.3.24
      - name: Run native-backed Windows policy tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m pytest tests/test_mercurial.py tests/test_subversion.py
          tests/test_subversion_unit.py tests/test_svn_oracle.py
          tests/test_breezy.py tests/test_breezy_oracle.py -q
      - name: Check Windows native captures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m scripts.ci native --backends hg svn brz
          --output-dir "$env:RUNNER_TEMP/native"
      - name: Capture Jujutsu on Windows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          $clientDir = Join-Path $env:RUNNER_TEMP 'compat-clients'
          $nativeDir = Join-Path $env:RUNNER_TEMP 'native'
          New-Item -ItemType Directory -Force -Path $clientDir, $nativeDir | Out-Null
          $jjArchive = Join-Path $clientDir 'jj-windows-x64.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-pc-windows-msvc.zip' `
            -OutFile $jjArchive
          $jjDigest = (Get-FileHash -Algorithm SHA256 $jjArchive).Hash.ToLowerInvariant()
          if ($jjDigest -ne '72f9f80bc99d07a7f48d5f219cf5bab91f7e906e4b53f6c827948e646cd1152f') {
            throw "Jujutsu release checksum mismatch: $jjDigest"
          }
          $jjDir = Join-Path $clientDir 'jj'
          Expand-Archive -Path $jjArchive -DestinationPath $jjDir -Force
          $jj = Join-Path $jjDir 'jj.exe'
          if (-not (Test-Path $jj)) { throw "Jujutsu executable was not found: $jj" }
          $output = Join-Path $nativeDir 'jj-0.47.1-windows-x64.json'
          python tests/oracles/compat/run.py --jj $jj --jj-only --output $output
          if ($LASTEXITCODE -ne 0) { throw "Jujutsu capture failed: $LASTEXITCODE" }
          $boundaryOutput = Join-Path $nativeDir 'workspace-boundaries-jj-0.47.1-windows-x64.json'
          python tests/oracles/compat/run.py --jj $jj --jj-only --workspace-boundary-only --output $boundaryOutput
          if ($LASTEXITCODE -ne 0) { throw "Jujutsu workspace-boundary capture failed: $LASTEXITCODE" }
          $linkedOutput = Join-Path $nativeDir 'linked-worktree-jj-0.47.1-windows-x64.json'
          python tests/oracles/compat/run.py --jj $jj --jj-only --linked-worktree-only --output $linkedOutput
          if ($LASTEXITCODE -ne 0) { throw "Jujutsu linked-worktree capture failed: $LASTEXITCODE" }
          @'
          import json
          import os
          from pathlib import Path

          from scripts.ci_native import inspect_capture

          path = Path(os.environ["RUNNER_TEMP"]) / "native/jj-0.47.1-windows-x64.json"
          boundary_path = Path(os.environ["RUNNER_TEMP"]) / "native/workspace-boundaries-jj-0.47.1-windows-x64.json"
          linked_path = Path(os.environ["RUNNER_TEMP"]) / "native/linked-worktree-jj-0.47.1-windows-x64.json"
          result = inspect_capture(path)
          capture = json.loads(path.read_text(encoding="utf-8"))
          boundary = json.loads(boundary_path.read_text(encoding="utf-8"))
          linked = json.loads(linked_path.read_text(encoding="utf-8"))
          assert result["passed"], result
          assert len(boundary["cases"]) == 4
          assert boundary["clients"]["jujutsu"].startswith("jj 0.47.1")
          assert all(case["candidate_matches"] for case in boundary["cases"])
          assert len(capture["cases"]) == 2
          assert {case["id"] for case in capture["cases"]} == {"jj.colocated", "jj.noncolocated"}
          assert set(capture["clients"]) == {"git", "jujutsu"}
          assert capture["clients"]["git"].startswith("git version ")
          assert capture["clients"]["jujutsu"].startswith("jj 0.47.1")
          assert all(case["pattern_discovery"]["candidate_matches"] for case in capture["cases"])
          assert all(case["configured_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["configured_system"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_global"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_worktree_i"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_onbranch"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_remote_url"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["candidate_matches"] for case in capture["cases"])
          assert all(case["conditional_gitdir_override"]["git_config_matches"] for case in capture["cases"])
          assert all(not case["conditional_gitdir_override"]["native_matches_git_config"] for case in capture["cases"])
          assert all(case["environment_global"]["candidate_matches"] for case in capture["cases"])
          assert all(
              case["symlinked_gitignore"]["candidate_matches"]
              or case["symlinked_gitignore"]["native_status"] == "skipped"
              for case in capture["cases"]
          )
          assert linked["status"] == "captured"
          assert linked["workspace"] == "Git linked worktree"
          assert "gitignore-walk-linked-worktree-" not in json.dumps(linked)
          assert set(linked["clients"]) == {"git", "jujutsu"}
          assert [case["id"] for case in linked["cases"]] == ["git", "jj.colocated"]
          assert [case["ignored"] for case in linked["cases"]] == [
              ["probe.commonignore"],
              ["probe.worktreeignore"],
          ]
          assert "Working copy  (@) : <working-copy>" in linked["cases"][1]["status_stdout"]
          assert all(case["candidate_matches"] for case in linked["cases"])
          print(result)
          '@ | python -
      - name: Check Windows Registry and INI precedence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python tests/oracles/svn/windows_registry.py
          --allow-registry-mutation
          --output "$env:RUNNER_TEMP/native/svn-windows-registry.json"
      - name: Probe Breezy default Windows ignore-file location
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/native" | Out-Null
          python tests/oracles/breezy/windows_default_config.py `
            --allow-user-config-mutation `
            --output "$env:RUNNER_TEMP/native/brz-windows-default-config.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-oracles
          path: ${{ runner.temp }}/native
          if-no-files-found: warn
          retention-days: 7

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Mercurial
        shell: pwsh
        run: |
          winget install --id Mercurial.Mercurial --exact --silent --accept-package-agreements --accept-source-agreements
          $hgPath = (Get-Command hg.exe -ErrorAction SilentlyContinue).Source
          if (-not $hgPath) {
            $candidates = @(
              "$env:ProgramFiles\Mercurial\hg.exe",
              "${env:ProgramFiles(x86)}\Mercurial\hg.exe"
            )
            $hgPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $hgPath) { throw 'Mercurial installed, but hg.exe was not found.' }
          Split-Path $hgPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $hgPath --version
      - name: Install SlikSVN command line tools
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'Slik-Subversion-1.14.5-x64.msi'
          Invoke-WebRequest `
            -Uri 'https://sliksvn.com/pub/Slik-Subversion-1.14.5-x64.msi' `
            -OutFile $installer
          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart') `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "SlikSVN installer failed: $($install.ExitCode)" }
          $svnBin = Join-Path $env:ProgramFiles 'SlikSvn\bin'
          $svnPath = Join-Path $svnBin 'svn.exe'
          if (-not (Test-Path $svnPath)) { throw "SlikSVN installation did not contain $svnPath." }
          if (-not (Test-Path (Join-Path $svnBin 'svnadmin.exe'))) {
            throw 'SlikSVN installation did not contain svnadmin.exe.'
          }
          if (-not (Test-Path (Join-Path $svnBin 'svnserve.exe'))) {
            Write-Host 'svnserve is unavailable; protocol-dependent Subversion cases will be explicitly skipped.'
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $svnPath --version --quiet
      - name: Install package and test tools
        id: setup
        run: python -m pip install -e . 'pytest>=8.3' breezy==3.3.24
      - name: Run native-backed Windows policy tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m pytest tests/test_mercurial.py tests/test_subversion.py
          tests/test_subversion_unit.py tests/test_svn_oracle.py
          tests/test_breezy.py tests/test_breezy_oracle.py -q
      - name: Capture historical Darcs Windows profile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:RUNNER_TEMP 'native'
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null
          $darcs = Join-Path $env:RUNNER_TEMP 'darcs-2.16.3.exe'
          Invoke-WebRequest `
            -Uri 'https://darcs.net/binaries/windows/darcs-2.16.3.exe' `
            -OutFile $darcs
          $digest = (Get-FileHash -Algorithm SHA256 $darcs).Hash.ToLowerInvariant()
          if ($digest -ne '9003fe97e154db1bb4e028c0e93d8cc4eae9fa69a9752b04a2e6c24a5be1764b') {
            throw "Darcs 2.16.3 Windows binary checksum mismatch: $digest"
          }
          & $darcs --version
          if ($LASTEXITCODE -ne 0) { throw "Darcs --version failed: $LASTEXITCODE" }
          $output = Join-Path $nativeDir 'darcs-2.16.3-windows-x64.json'
          python tests/oracles/darcs/run.py --darcs $darcs --output $output
          $captureExit = $LASTEXITCODE
          if ($captureExit -notin @(0, 1)) { throw "Darcs capture failed: $captureExit" }
          @'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "native/darcs-2.16.3-windows-x64.json"
          capture = json.loads(path.read_text(encoding="utf-8"))
          assert capture["status"] == "captured", capture
          assert capture["client"]["version"].startswith("2.16.3"), capture["client"]
          closed = [case for case in capture["cases"] if case["expected_boring"] is not None]
          assert len(closed) == 18, len(closed)
          mismatches = [
              case["id"] for case in closed
              if case["expected_boring"] != case["observed_boring"]
          ]
          print("Historical Darcs 2.16.3 Windows observations; not current-release conformance.")
          print("Closed observations:", len(closed), "mismatches:", mismatches)
          assert mismatches == ["darcs.boringfile-replaces-local"], mismatches
          '@ | python -
      - name: Check Windows native captures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m scripts.ci native --backends hg svn brz
          --output-dir "$env:RUNNER_TEMP/native"
      - name: Capture Breezy source precedence on Windows x86_64
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
